# Identity of agent pods when SCHEDULER_K8S_SERVICE_ACCOUNT=docling-agent: only
# needed for an MLflow server that authorizes with Kubernetes RBAC (OpenShift
# AI, SCHEDULER_CONTAINER_MLFLOW_TRACKING_AUTH=kubernetes-namespaced). It has no
# access to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docling-agent
