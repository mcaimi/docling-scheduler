# Least privilege for the Kubernetes executor, in its namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: docling-scheduler
rules:
  # one Job per shard attempt; patch suspends on cancel
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # per-run secrets (sensitive settings); never listed or read back
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
  # run anchor (owner of every run object) and mounted files
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  # optional: resource usage, when metrics-server is installed
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
