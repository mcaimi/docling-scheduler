# Vanilla Kubernetes, after the scheduler component: exposes the UI and API
# through an Ingress. Put the same hostname in SCHEDULER_ALLOWED_HOSTS /
# SCHEDULER_ALLOWED_ORIGINS (scheduler.env), and terminate TLS: the bearer
# token must not travel in clear text.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ingress.yaml
