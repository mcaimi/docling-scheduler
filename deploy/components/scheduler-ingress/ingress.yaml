apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docling-scheduler
  labels:
    app.kubernetes.io/name: docling-scheduler
  annotations:
    # ingress-nginx: don't buffer or time out log streams (SSE)
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  # ingressClassName: nginx
  tls:
    - hosts:
        - docling-scheduler.apps.example.com
      secretName: docling-scheduler-tls
  rules:
    - host: docling-scheduler.apps.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docling-scheduler
                port:
                  name: http
