[project]
name = "docling-scheduler"
version = "0.1.0"
description = "Launches and monitors containerised docling-agent runs (Podman + MLflow)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.136.1",
    "mlflow>=3.17.2",
    "podman>=5.8.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.47.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.0.0",
]

[project.scripts]
docling-scheduler = "docling_scheduler.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docling_scheduler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
